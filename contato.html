<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Maria Clara</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header header-solid">
        <div class="container">
            <div class="logo">
                <span class="logo-icon">MC</span>
                <div class="logo-text">
                    <h1>MARIA CLARA</h1>
                    <span>STORYMAKER</span>
                </div>
            </div>
            <nav class="navbar">
                <ul class="nav-menu">
                    <li><a href="index.html">Início</a></li>
                    <li><a href="servicos.html">Serviços</a></li>
                    <li><a href="sobre.html">Sobre mim</a></li>
                    <li><a href="portfolio.html">Meu trabalho</a></li>
                    <li><a href="contato.html" class="active">Contato</a></li>
                </ul>
                <div class="hamburger"><span class="bar"></span><span class="bar"></span><span class="bar"></span></div>
            </nav>
        </div>
    </header>

    <section class="page-title-section">
        <div class="container">
            <h2>Vamos eternizar sua história?</h2>
            <p>Entre em contato e conte um pouquinho sobre o seu evento.</p>
        </div>
    </section>

    <section class="contact-section">
        <div class="container">
            <!-- IMPORTANTE: Troque o e-mail no action abaixo pelo SEU e-mail -->
            <form action="https://formsubmit.co/seu-email@aqui.com" method="POST" class="contact-form">
                
                <div class="form-group">
                    <label for="nome">Seu Nome Completo</label>
                    <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">
                </div>

                <div class="form-group">
                    <label for="email">Seu E-mail</label>
                    <input type="email" id="email" name="email" required placeholder="seu@email.com">
                </div>

                <div class="form-group">
                    <label for="tipo-evento">Tipo de Evento</label>
                    <select id="tipo-evento" name="tipo-evento" style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-family: var(--font-sans);">
                        <option value="pre-wedding">Pré-Wedding</option>
                        <option value="aniversario">Aniversário</option>
                        <option value="batizado">Batizado</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="data">Data do Evento</label>
                    <input type="date" id="data" name="data">
                </div>

                <div class="form-group">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" rows="5" required placeholder="Conte um pouquinho sobre o que você imagina para o seu evento..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">ENVIAR MENSAGEM <i class="fas fa-paper-plane"></i></button>
            </form>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Maria Clara Storymaker. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
